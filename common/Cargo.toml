[package]
name = "common"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { workspace = true }
axum = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
http-body-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
redis = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
jsonwebtoken = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
bcrypt = { workspace = true }
aws-sdk-s3 = { workspace = true, optional = true }
rand = { workspace = true }
argon2 = "0.5.3"
# 配置监听
config = { workspace = true, features = ["yaml", "toml", "json"] }
notify = { version = "8.0.0", optional = true }
mongodb = "3.2.3"
# 添加rustls依赖
rustls = "0.23.26"
# 添加签名计算相关依赖
hmac = "0.12.1"
sha2 = "0.10.8"
base64 = "0.21.5"

# 链路追踪和日志
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
# 分布式链路追踪依赖，可选
opentelemetry = { version = "0.20", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.13", features = ["http-proto", "tonic"], optional = true }
tracing-opentelemetry = { version = "0.20", optional = true }
tower = { workspace = true }
# 正则表达式
regex = "1.11.1"
once_cell = "1.21.3"
# Consul
rs-consul = "0.11.0"  # 使用最新版本
hostname = "0.4"  # 用于获取主机名
http = "1.3.1"
image = "0.25"
# 0.27 起不再依赖有漏洞的 rulinalg（RUSTSEC-2020-0023），字体库由 rusttype 换为 ab_glyph
imageproc = "0.27"
ab_glyph = "0.2"

[features]
default = []
dynamic-config = ["notify"]
# 分布式链路追踪（默认关闭：opentelemetry-otlp 0.13 会引入旧版 tonic 0.9 ->
# axum 0.6 -> hyper 0.14 -> h2 0.3，命中 RUSTSEC-2026-0258）
# 如需启用，建议同时将 opentelemetry 系列升级到最新版
telemetry = ["dep:opentelemetry", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]
# AWS S3 支持（默认关闭：aws-smithy-http-client 仍依赖 h2 0.3 / rustls 0.21，
# 会引入 RUSTSEC-2026-0258 等上游漏洞；前端签名上传走 cos/oss 提供商即可）
s3 = ["dep:aws-sdk-s3"]

[build-dependencies]
tonic-build = { workspace = true }