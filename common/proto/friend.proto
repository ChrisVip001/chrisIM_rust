syntax = "proto3";

package friend;

import "google/protobuf/timestamp.proto";

// 好友服务
service FriendService {
  // 发送好友请求
  rpc SendFriendRequest (SendFriendRequestRequest) returns (FriendshipResponse);
  
  // 接受好友请求
  rpc AcceptFriendRequest (AcceptFriendRequestRequest) returns (FriendshipResponse);
  
  // 拒绝好友请求
  rpc RejectFriendRequest (RejectFriendRequestRequest) returns (FriendshipResponse);
  
  // 获取好友列表
  rpc GetFriendList (GetFriendListRequest) returns (GetFriendListResponse);
  
  // 获取好友请求列表
  rpc GetFriendRequests (GetFriendRequestsRequest) returns (GetFriendRequestsResponse);
  
  // 删除好友
  rpc DeleteFriend (DeleteFriendRequest) returns (DeleteFriendResponse);
  
  // 检查好友关系
  rpc CheckFriendship (CheckFriendshipRequest) returns (CheckFriendshipResponse);
  
  // 拉黑用户
  rpc BlockUser (BlockUserRequest) returns (BlockUserResponse);
  
  // 解除拉黑
  rpc UnblockUser (UnblockUserRequest) returns (UnblockUserResponse);
  
  // 是否拉黑状态
  rpc IsBlocked (IsBlockedRequest) returns (IsBlockedResponse);
  
  // 创建或更新好友分组
  rpc CreateOrUpdateFriendGroup (CreateOrUpdateFriendGroupRequest) returns (FriendGroupResponse);
  
  // 删除好友分组
  rpc DeleteFriendGroup (DeleteFriendGroupRequest) returns (DeleteFriendGroupResponse);
  
  // 获取好友分组列表
  rpc GetFriendGroups (GetFriendGroupsRequest) returns (GetFriendGroupsResponse);
  
  // 获取分组好友列表
  rpc GetGroupFriends (GetGroupFriendsRequest) returns (GetGroupFriendsResponse);
  
  // 搜索潜在好友
  rpc SearchPotentialFriends (SearchPotentialFriendsRequest) returns (SearchPotentialFriendsResponse);
  
  // 获取所有好友详细列表（无分页）
  rpc GetAllFriendDetailList (GetAllFriendDetailListRequest) returns (GetAllFriendDetailListResponse);
  
  // 设置好友星标状态
  rpc ToggleFriendStar (ToggleFriendStarRequest) returns (ToggleFriendStarResponse);
  
  // 设置好友置顶状态
  rpc ToggleFriendTop (ToggleFriendTopRequest) returns (ToggleFriendTopResponse);
  
  // 更新好友备注
  rpc UpdateFriendRemark (UpdateFriendRemarkRequest) returns (UpdateFriendRemarkResponse);
  
  // 获取黑名单列表
  rpc GetUserBlacklist (GetUserBlacklistRequest) returns (GetUserBlacklistResponse);

  // 获取好友关系记录
  rpc GetFriendRelation(GetFriendRelationRequest) returns (GetFriendRelationResponse);
}

// 发送好友请求
message SendFriendRequestRequest {
  string user_id = 1;
  string friend_id = 2;
  string message = 3;
}

// 接受好友请求
message AcceptFriendRequestRequest {
  string user_id = 1;
  string request_id = 3;  // 好友请求ID
}

// 拒绝好友请求
message RejectFriendRequestRequest {
  string user_id = 1;
  string reason = 3;
  string request_id = 4;  // 好友请求ID
}

// 获取好友列表请求
message GetFriendListRequest {
  string user_id = 1;
  int64 page = 2;         // 页码，从1开始，0表示使用默认值
  int64 page_size = 3;    // 每页数量，0表示使用默认值
  string sort_by = 4;     // 排序方式: username_asc, username_desc, created_at_asc, created_at_desc
  string keyword = 5;     // 搜索关键词，用于搜索好友名称、昵称或备注
}

// 获取好友列表响应
message GetFriendListResponse {
  repeated Friend friends = 1;
  int64 total = 2;        // 总条数
}

// 获取好友请求列表请求
message GetFriendRequestsRequest {
  string user_id = 1;
  int64 page = 2;         // 页码，从1开始，0表示默认
  int64 page_size = 3;    // 每页数量，0表示默认
}

// 获取好友请求列表响应
message GetFriendRequestsResponse {
  repeated Friendship requests = 1;
  int64 total = 2;        // 总条数
}

// 删除好友请求
message DeleteFriendRequest {
  string user_id = 1;
  string friend_id = 2;
}

// 删除好友响应
message DeleteFriendResponse {
  bool success = 1;
}

// 检查好友关系请求
message CheckFriendshipRequest {
  string user_id = 1;
  string friend_id = 2;
}

// 检查好友关系响应
message CheckFriendshipResponse {
  FriendRelationType status = 1;
}

// 好友关系响应
message FriendshipResponse {
  Friendship friendship = 1;
}

// 好友关系
message Friendship {
  string id = 1;
  string user_id = 2;
  string friend_id = 3;
  string message = 4;
  FriendshipStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  optional string reject_reason = 8;
  optional string friend_username = 9;    // 好友用户名
  optional string friend_nickname = 10;   // 好友昵称
  optional string friend_avatar_url = 11; // 好友头像
}

// 好友
message Friend {
  string id = 1;
  optional string username = 2;
  optional string nickname = 3;
  optional string avatar_url = 4;
  google.protobuf.Timestamp friendship_created_at = 5;
  optional string remark = 6;   // 好友备注名称
}

// 好友关系状态
enum FriendshipStatus {
  PENDING = 0;
  ACCEPTED = 1;
  REJECTED = 2;
  BLOCKED = 3;
  EXPIRED = 4;  // 过期状态
}

// 好友关系类型（用于CheckFriendship接口）
enum FriendRelationType {
  NO_FRIEND = 0;      // 没有好友关系
  IS_FRIEND = 1;      // 已是好友
  PENDING_REQUEST = 2; // 对方发送的请求待处理
  APPLIED = 3;        // 自己发送的请求
}

// 拉黑用户请求
message BlockUserRequest {
  string user_id = 1;        // 操作用户ID
  string blocked_user_id = 2; // 被拉黑用户ID
  string reason = 3;         // 拉黑原因（可选）
}

// 是否拉黑状态请求
message IsBlockedRequest {
  string user_id = 1;        // 操作用户ID
  string blocked_user_id = 2; // 被操作的用户ID
}

// 拉黑用户响应
message BlockUserResponse {
  UserBlacklist blacklist = 1;
}

// 解除拉黑请求
message UnblockUserRequest {
  string user_id = 1;        // 操作用户ID
  string blocked_user_id = 2; // 被解除拉黑的用户ID
}

// 解除拉黑响应
message UnblockUserResponse {
  bool success = 1;
}

// 是否拉黑状态响应
message IsBlockedResponse {
  bool is_blocked = 1;
}

// 用户黑名单记录
message UserBlacklist {
  string id = 1;                         // 黑名单记录ID
  string user_id = 2;                    // 用户ID（拉黑操作的发起者）
  string blocked_user_id = 3;            // 被拉黑用户ID
  optional string reason = 4;            // 拉黑原因
  google.protobuf.Timestamp created_at = 5; // 拉黑时间
}

// 带用户信息的黑名单记录
message UserBlacklistWithInfo {
  UserBlacklist blacklist = 1;           // 黑名单记录
  optional string username = 2;          // 被拉黑用户的用户名
  optional string nickname = 3;          // 被拉黑用户的昵称
  optional string avatar_url = 4;        // 被拉黑用户的头像
}

// 获取黑名单列表请求
message GetUserBlacklistRequest {
  string user_id = 1;                    // 用户ID
}

// 获取黑名单列表响应
message GetUserBlacklistResponse {
  repeated UserBlacklistWithInfo blacklist = 1; // 黑名单列表（带用户信息）
  int64 total = 2;                             // 总数
}

// 好友分组
message FriendGroup {
  string id = 1;                                // 分组ID (VARCHAR(36) PRIMARY KEY)
  string user_id = 2;                           // 用户ID (VARCHAR(36) NOT NULL)
  string group_name = 3;                        // 分组名称 (VARCHAR(50) NOT NULL)
  int32 sort_order = 4;                         // 排序顺序 (INT DEFAULT 0)
  google.protobuf.Timestamp created_at = 5;     // 创建时间 (TIMESTAMP DEFAULT CURRENT_TIMESTAMP)
  google.protobuf.Timestamp updated_at = 6;     // 更新时间 (TIMESTAMP DEFAULT CURRENT_TIMESTAMP)
  int32 friend_count = 7;                       // 分组内好友数量（计算字段）
}

// 创建或更新好友分组请求
message CreateOrUpdateFriendGroupRequest {
  optional string id = 1;        // 分组ID，如果为空则创建新分组
  string user_id = 2;           // 用户ID
  string group_name = 3;        // 分组名称
  int32 sort_order = 4;         // 排序顺序
  repeated string friend_ids = 5; // 分组中的好友ID列表
}

// 好友分组响应
message FriendGroupResponse {
  FriendGroup group = 1;
  repeated string friend_ids = 2; // 分组中的好友ID列表
}

// 删除好友分组请求
message DeleteFriendGroupRequest {
  string id = 1;
  string user_id = 2;
}

// 删除好友分组响应
message DeleteFriendGroupResponse {
  bool success = 1;
}

// 获取好友分组列表请求
message GetFriendGroupsRequest {
  string user_id = 1;
}

// 获取好友分组列表响应
message GetFriendGroupsResponse {
  repeated FriendGroup groups = 1;
}

// 获取分组好友列表请求
message GetGroupFriendsRequest {
  string group_id = 1;  // 分组ID
  string user_id = 2;   // 用户ID
}

// 获取分组好友列表响应
message GetGroupFriendsResponse {
  repeated Friend friends = 1;  // 好友列表
  int32 total = 2;             // 总数
}

// 搜索潜在好友请求
message SearchPotentialFriendsRequest {
  string user_id = 1;           // 当前用户ID
  string search_term = 2;       // 搜索关键词（精确匹配custom_id或手机号）
}

// 搜索潜在好友响应
message SearchPotentialFriendsResponse {
  repeated PotentialFriend users = 1;  // 搜索结果
}

// 潜在好友信息
message PotentialFriend {
  string id = 1;                      // 用户ID
  string username = 2;                // 用户名
  optional string nickname = 3;       // 昵称
  optional string avatar_url = 4;     // 头像地址
  optional string phone = 5;          // 手机号（可能会根据隐私设置处理）
  FriendshipStatus friendship_status = 6; // 好友关系状态，如果有的话
  optional string sign = 7; // 个性签名
}

// 好友类型
enum FriendType {
  FRIEND = 0;    // 普通好友
  OFFICIAL = 1;  // 官方账号
  SYSTEM = 2;    // 系统账号
}

// 详细好友信息
message DetailedFriend {
  string id = 1;
  optional string username = 2;
  optional string nickname = 3;
  optional string avatar_url = 4;
  google.protobuf.Timestamp friendship_created_at = 5;
  optional string remark = 6;    // 好友备注名称
  bool is_online = 7;            // 是否在线
  bool is_starred = 8;           // 是否星标
  bool is_top = 9;               // 是否置顶
  int32 relation_status = 10;    // 关系状态：1-正常好友 2-已拉黑
  FriendType friend_type = 11;   // 好友类型：0-普通好友 1-官方账号 2-系统账号
}

// 获取所有好友详细列表请求（无分页）
message GetAllFriendDetailListRequest {
  string user_id = 1;           // 用户ID
}

// 获取所有好友详细列表响应（无分页）
message GetAllFriendDetailListResponse {
  repeated DetailedFriend friends = 1;  // 好友列表
}

// 设置好友星标状态请求
message ToggleFriendStarRequest {
  string user_id = 1;        // 用户ID
  string friend_id = 2;      // 好友ID
  bool is_starred = 3;       // 是否星标
}

// 设置好友星标状态响应
message ToggleFriendStarResponse {
  bool success = 1;          // 操作是否成功
}

// 设置好友置顶状态请求
message ToggleFriendTopRequest {
  string user_id = 1;        // 用户ID
  string friend_id = 2;      // 好友ID
  bool is_top = 3;           // 是否置顶
}

// 设置好友置顶状态响应
message ToggleFriendTopResponse {
  bool success = 1;          // 操作是否成功
}

// 更新好友备注请求
message UpdateFriendRemarkRequest {
  string user_id = 1;      // 用户ID
  string friend_id = 2;    // 好友ID
  string remark = 3;       // 新的备注
}

// 更新好友备注响应
message UpdateFriendRemarkResponse {
  bool success = 1;          // 操作是否成功
  DetailedFriend friend = 2; // 更新后的好友信息
}

// 获取好友关系记录请求
message GetFriendRelationRequest {
  string user_id = 1;      // 用户ID
  string friend_id = 2;    // 好友ID
}

// 获取好友关系记录响应
message GetFriendRelationResponse{
  DetailedFriend friend = 1;
}

/// 创建好友申请请求
message FsCreate {
  string user_id = 1;           // 申请者用户ID
  string friend_id = 2;         // 被申请者用户ID
  optional string apply_msg = 3; // 申请消息
  optional string req_remark = 4; // 申请备注
  string source = 5;            // 申请来源
}

/// 更新好友申请请求（仅用于更新好友申请请求）
message FsUpdate {
  string id = 1;          // 好友申请ID
  string apply_msg = 2;   // 申请消息
  string req_remark = 3;  // 申请备注
}

/// 同意好友申请响应
message AgreeReply {
  string fs_id = 1;                // 好友申请ID
  optional string resp_msg = 2;    // 响应消息
  optional string resp_remark = 3; // 响应备注
}

/// 好友数据库记录
message FriendDb {
  int64 id = 1;                // 数据库记录ID
  string fs_id = 2;            // 好友关系ID
  string user_id = 3;          // 用户ID
  string friend_id = 4;        // 好友ID
  FriendshipStatus status = 5; // 好友状态
  optional string remark = 6;  // 备注
  string source = 7;           // 来源
  int64 create_time = 8;       // 创建时间
  int64 update_time = 9;       // 更新时间
}

/// 好友信息（详细版本）
message FriendInfo {
  string id = 1;              // 好友用户ID
  string name = 2;            // 好友姓名
  string avatar = 3;          // 好友头像
  string gender = 4;          // 好友性别
  int32 age = 5;              // 好友年龄
  optional string region = 6; // 好友地区
  string account = 7;         // 好友账号
  string signature = 8;       // 好友个性签名
  optional string email = 9;  // 好友邮箱
}

/// 带用户信息的好友关系
message FriendshipWithUser {
  string fs_id = 1;             // 好友关系ID
  string user_id = 2;           // 用户ID
  string name = 3;              // 用户姓名
  string avatar = 4;            // 用户头像
  string gender = 5;            // 用户性别
  int32 age = 6;                // 用户年龄
  optional string region = 7;   // 用户地区
  FriendshipStatus status = 8;  // 好友状态
  optional string apply_msg = 9; // 申请消息
  string source = 10;           // 申请来源
  int64 create_time = 11;       // 创建时间
  string account = 12;          // 用户账号
  optional string remark = 13;  // 备注
  optional string email = 14;   // 用户邮箱
}

/// 完整的好友信息（来自原message.proto）
message FriendComplete {
  string fs_id = 1;             // 好友关系ID
  string friend_id = 2;         // 好友用户ID
  string account = 3;           // 好友账号
  string name = 4;              // 好友姓名
  string avatar = 5;            // 好友头像
  string gender = 6;            // 好友性别
  int32 age = 7;                // 好友年龄
  optional string region = 8;   // 好友地区
  FriendshipStatus status = 9;  // 好友状态
  optional string remark = 10;  // 备注
  optional string email = 11;   // 好友邮箱
  string source = 12;           // 申请来源
  string signature = 13;        // 好友个性签名
  int64 create_time = 14;       // 创建时间
  int64 update_time = 15;       // 更新时间
}

/// 完整的好友关系信息（来自原message.proto）
message FriendshipComplete {
  string id = 1;                    // 好友关系ID
  string user_id = 2;               // 用户ID
  string friend_id = 3;             // 好友ID
  FriendshipStatus status = 4;      // 好友状态
  optional string apply_msg = 5;    // 申请消息
  optional string req_remark = 6;   // 申请备注
  optional string resp_msg = 7;     // 响应消息
  optional string resp_remark = 8;  // 响应备注
  string source = 9;                // 申请来源
  int64 create_time = 10;           // 创建时间
  int64 update_time = 11;           // 更新时间
}


// 好友分组关系（与friend_group_relation表对应）
message FriendGroupRelation {
  string id = 1;                                // 关系ID (VARCHAR(36) PRIMARY KEY)
  string user_id = 2;                           // 用户ID (VARCHAR(36) NOT NULL)
  string friend_id = 3;                         // 好友ID (VARCHAR(36) NOT NULL)
  string group_id = 4;                          // 分组ID (VARCHAR(36) NOT NULL)
  google.protobuf.Timestamp created_at = 5;     // 创建时间 (TIMESTAMP DEFAULT CURRENT_TIMESTAMP)
  google.protobuf.Timestamp updated_at = 6;     // 更新时间 (TIMESTAMP DEFAULT CURRENT_TIMESTAMP)
}
