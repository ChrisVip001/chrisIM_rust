# 密钥模板：填入真实值后再 apply（或改用 sealed-secrets / external-secrets）
# 应用通过环境变量读取以下密钥，config.yaml 中的对应字段留空即可。
apiVersion: v1
kind: Secret
metadata:
  name: rustim-secrets
  namespace: rustim
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me"
  JWT_SECRET: "change-me"
  OSS_ACCESS_KEY: ""
  OSS_SECRET_KEY: ""
  SMS_SECRET_ID: ""
  SMS_SECRET_KEY: ""
