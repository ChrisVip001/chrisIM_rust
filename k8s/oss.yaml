# 对象存储服务
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oss
  namespace: rustim
  labels:
    app: oss
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oss
  template:
    metadata:
      labels:
        app: oss
    spec:
      containers:
        - name: oss
          image: rustim/oss:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50005
              name: grpc
          env:
            - name: OSS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustim-secrets
                  key: OSS_ACCESS_KEY
            - name: OSS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustim-secrets
                  key: OSS_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 50005
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: rustim-config
---
apiVersion: v1
kind: Service
metadata:
  name: oss
  namespace: rustim
spec:
  selector:
    app: oss
  ports:
    - port: 50005
      targetPort: 50005
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: oss
  namespace: rustim
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: oss
