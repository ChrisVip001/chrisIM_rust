# API 网关：HTTP 入口（JWT/限流/熔断），经 Consul 发现内部 gRPC 服务
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: rustim
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      terminationGracePeriodSeconds: 30   # 与 RTO 30s 预算对齐
      containers:
        - name: api-gateway
          image: rustim/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rustim-secrets
                  key: JWT_SECRET
            - name: OSS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustim-secrets
                  key: OSS_ACCESS_KEY
            - name: OSS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustim-secrets
                  key: OSS_SECRET_KEY
            - name: CONSUL_HOST
              value: consul.rustim.svc.cluster.local
            - name: ADVERTISE_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: rustim-config
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: rustim
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: rustim
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  namespace: rustim
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway
