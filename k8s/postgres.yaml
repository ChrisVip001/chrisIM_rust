# PostgreSQL：消息与会话数据存储（读扩散模型 + HASH 分区）
# 生产高可用建议替换为 CloudNativePG Operator 管理的主从集群。
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: rustim
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: pg
          env:
            - name: POSTGRES_USER
              value: rustim
            - name: POSTGRES_DB
              value: rustim
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rustim-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          args:
            - "-c"
            - "max_connections=400"
            - "-c"
            - "shared_buffers=512MB"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "rustim", "-d", "rustim"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: rustim
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
