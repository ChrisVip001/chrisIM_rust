# 消息服务：gRPC 接入 + Kafka 消费/落库/推送
#
# 扩容注意：消费能力 = min(消费者实例数 × consumer.parallelism, 分区数 16)；
# 超出分区数的实例只提供 gRPC 接入能力。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: msg-server
  namespace: rustim
  labels:
    app: msg-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: msg-server
  template:
    metadata:
      labels:
        app: msg-server
    spec:
      terminationGracePeriodSeconds: 60   # 等待在途消息批次落库后再退出
      containers:
        - name: msg-server
          image: rustim/msg-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50010
              name: grpc
          readinessProbe:
            grpc:
              port: 50010
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 50010
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: rustim-config
---
apiVersion: v1
kind: Service
metadata:
  name: msg-server
  namespace: rustim
spec:
  selector:
    app: msg-server
  ports:
    - port: 50010
      targetPort: 50010
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: msg-server
  namespace: rustim
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: msg-server
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: msg-server
  namespace: rustim
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: msg-server
