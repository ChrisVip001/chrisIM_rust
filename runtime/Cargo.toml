[package]
name = "runtime"
version.workspace = true
edition = "2021"

# 运行时基础设施：配置、日志/链路追踪、服务注册与发现、gRPC 连接工厂。
# 约束：只放与具体业务无关的适配代码，不放任何域模型。
[dependencies]
contract = { path = "../contract" }

tokio = { workspace = true }
axum = { workspace = true }
tonic = { workspace = true }
http-body-util = { workspace = true }
http = "1.3.1"
tower = { workspace = true }

prost-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
redis = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
opentelemetry = { version = "0.20", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.13", features = ["http-proto", "tonic"], optional = true }
tracing-opentelemetry = { version = "0.20", optional = true }

anyhow = { workspace = true }
thiserror = { workspace = true }
jsonwebtoken = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
bcrypt = { workspace = true }
rand = { workspace = true }
argon2 = "0.5.3"

config = { workspace = true, features = ["yaml", "toml", "json"] }


rustls = "0.23.26"
hmac = "0.12.1"
sha2 = "0.10.8"
base64 = "0.21.5"

regex = "1.11.1"
once_cell = "1.21.3"
futures = { workspace = true }

rs-consul = "0.11.0"
hostname = "0.4"

# 验证码图片生成（utils::captcha）：只需要 PNG 编码 + 像素操作。
# 不引入 imageproc / ab_glyph —— 它们会把 ttf-parser（RUSTSEC-2026-0192，已不维护）
# 带进依赖图，而验证码是 6 位数字，内嵌 5x7 点阵字模足够。
image = "0.25"

[features]
default = []
# 分布式链路追踪（默认关闭：opentelemetry-otlp 0.13 会引入旧版 tonic 0.9 ->
# axum 0.6 -> hyper 0.14 -> h2 0.3，命中 RUSTSEC-2026-0258）
telemetry = ["dep:opentelemetry", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]
