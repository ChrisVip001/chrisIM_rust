version: '3.8'

services:
  # 注意：本机现有 rustim_postgres 数据卷是用 kelisi/123456 初始化的。
  # 若在此修改账号后首次 up，容器会被重建（数据卷保留，账号不生效于已初始化的库），
  # 因此这里保持与实际初始化参数一致。
  postgres:
    image: postgres:15-alpine
    container_name: rustim_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kelisi
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: rustim
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustim"]
      interval: 5s
      timeout: 5s
      retries: 5

  # redis 服务已于 2026-11-04 移除：
  # 6379 端口由盒子IM的 boxim-redis 提供，ChrisIM 配置(config.yaml)直连 127.0.0.1:6379 复用
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: rustim_zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: rustim_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # 宿主机服务直连 localhost:9092，advertised 必须与之匹配，
      # 否则客户端 bootstrap 后拿到 kafka:9092 无法解析
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data: