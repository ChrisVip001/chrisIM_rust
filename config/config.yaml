# API网关基础配置
# 路由配置
gateway:
  routes:
    routes:
      # 用户服务路由
      - id: "user-service"
        name: "用户服务"
        path_prefix: "/api/users"
        service_type: "User"
        require_auth: true
        methods: []
        rewrite_headers: {}

      # 好友服务路由
      - id: "friend-service"
        name: "好友服务"
        path_prefix: "/api/friends"
        service_type: "Friend"
        require_auth: true
        methods: []
        rewrite_headers: {}

      # 群组服务路由
      - id: "group-service"
        name: "群组服务"
        path_prefix: "/api/groups"
        service_type: "Group"
        require_auth: true
        methods: []
        rewrite_headers: {}

      # 聊天服务路由
      - id: "chat-service"
        name: "聊天服务"
        path_prefix: "/api/chat"
        service_type: "Chat"
        require_auth: true
        methods: []
        rewrite_headers: {}

      # 公共服务路由
      - id: "common-service"
        name: "聊天服务"
        path_prefix: "/api/common"
        service_type: "Common"
        require_auth: true
        methods: [ ]
        rewrite_headers: { }

  # 限流配置
  rate_limit:
    # 全局限流
    global:
      requests_per_second: 1000
      burst_size: 50
      enabled: true

    # 按路径限流
    path_rules:
      # 登录接口限流
      - path_prefix: "/api/user/login"
        rule:
          requests_per_second: 5
          burst_size: 3
          enabled: true
      - path_prefix: "/api/user/loginByPhone"
        rule:
          requests_per_second: 5
          burst_size: 3
          enabled: true

      # 注册接口限流
      - path_prefix: "/api/user/register"
        rule:
          requests_per_second: 2
          burst_size: 5
          enabled: true

      # 用户接口限流
      - path_prefix: "/api/users"
        rule:
          requests_per_second: 10
          burst_size: 20
          enabled: true

      # 聊天接口限流
      - path_prefix: "/api/chat"
        rule:
          requests_per_second: 20
          burst_size: 30
          enabled: true
    # IP限流
    ip_rules: {}

  # 认证配置
  auth:
    # JWT配置
    jwt:
      enabled: true
      secret: "change_this_to_a_secure_random_string"
      issuer: "api-gateway"
      expiry_seconds: 86400  # 24小时
      refresh_expiry_seconds: 604800  # 7天
      verify_issuer: false
      allowed_issuers: []
      header_name: "Authorization"
      header_prefix: "Bearer "
    # IP白名单
    ip_blacklist:
      - "192.168.1.9"
    # 路径白名单
    path_whitelist:
      - "/api/health"
      - "/metrics"
      - "/api/user/login"
      - "/api/user/loginByPhone"
      - "/api/users/registerByPhone"
      - "/api/users/registerByUsername"
      - "/api/users/sendVerificationCode"
      - "/api/users/genCaptchaImage"
      - "/api/users/forgetPassword"
      # 注册头像上传相关的API路径
      - "/api/files/register-avatar"
      - "/api/files/validate-register-avatar"
    # 安全头配置
    security_headers:
      enabled: true
      # 内容安全策略
      content_security_policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'"
      # 其他安全头
      x_frame_options: "DENY"
      x_content_type_options: "nosniff"
      x_xss_protection: "1; mode=block"
      strict_transport_security: "max-age=31536000; includeSubDomains"
      referrer_policy: "strict-origin-when-cross-origin"
    # 请求验证
    request_validation:
      max_request_size_mb: 10      # 最大请求大小
      max_header_count: 100        # 最大请求头数量
      max_header_size_kb: 8        # 单个请求头最大大小
      blocked_user_agents: []      # 阻止的User-Agent列表
      blocked_ips: []              # IP黑名单

  # Metrics暴露端点 指标配置
  metrics_endpoint: "/metrics"

  # 重试配置
  retry:
    max_retries: 3
    retry_interval_ms: 200

  # 熔断配置
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    half_open_timeout_secs: 30

component: all # all, api, ws, rpc, db, pusher

# 日志配置
log:
  level: "info"      # 全局日志级别: trace, debug, info, warn, error
  output: "file"  # 日志输出位置: console, file
  format: "json"     # 日志格式: plain, json (使用json格式便于ELK收集)
  sqlx_level: "debug" # SQL查询日志级别
  # 各组件的日志级别配置
  components:
    tower: "warn"    # HTTP中间件
    hyper: "warn"    # HTTP库
    axum: "info"     # HTTP框架
    tonic: "info"    # gRPC框架
    rustIM: "debug"  # 本项目的日志
    redis: "warn"    # Redis操作

# 链路追踪配置
telemetry:
  enabled: false                            # 从true改为false，暂时禁用
  endpoint: "http://localhost:4317"         # Jaeger OTLP端点
  sampling_ratio: 1.0                       # 采样率(0.0 - 1.0)
  propagation: "tracecontext"               # 传播器: tracecontext, b3, jaeger


# 数据库配置
database:
  postgres:
    host: 127.0.0.1
    port: 5432
    user: kelisi
    password: 123456
    database: rustim
  mongodb:
    host: 127.0.0.1
    port: 27017
    user:
    password:
    database: im
    clean:
      period: 3600 # days
      except_types:
        - "MsgTypeGroupInvitation"
        - "MsgTypeGroupInviteNew"
        - "MsgTypeGroupMemberExit"
        - "MsgTypeGroupRemoveMember"
        - "MsgTypeGroupDismiss"
        - "MsgTypeGroupUpdate"
        - "MsgTypeFriendApplyReq"
        - "MsgTypeFriendApplyResp"
        - "MsgTypeFriendBlack"
        - "MsgTypeFriendDelete"

  xdb: ./ip2region.xdb


# 服务配置
server:
  host: 127.0.0.1
  port: 8000
  ws_lb_strategy: RoundRobin # Random, RoundRobin
  # TLS/HTTPS配置
  tls:
    enabled: false  # 是否启用HTTPS
    cert_file: "./config/ssl/server.crt"  # 证书文件路径
    key_file: "./config/ssl/server.key"   # 私钥文件路径
    # 可选：客户端证书验证
    client_ca_file: "./config/ssl/ca.crt"  # CA证书文件
    require_client_cert: false  # 是否要求客户端证书
  # 超时配置
  timeouts:
    read_timeout_secs: 30      # 读取超时
    write_timeout_secs: 30     # 写入超时
    idle_timeout_secs: 60      # 空闲连接超时
  # 连接配置
  connection:
    max_connections: 10000     # 最大连接数
    keep_alive_timeout_secs: 75  # Keep-Alive超时
    tcp_nodelay: true          # 禁用Nagle算法


# consul服务注册与发现配置
service_center:
  host: 127.0.0.1   # "0.0.0.0" 在Docker中使用0.0.0.0绑定所有接口
  port: 8500
  timeout: 8080
  protocol: http
  service_refresh_interval: 30

# WebSocket配置
websocket:
  protocol: ws
  host: 127.0.0.1
  port: 8085
  name: websocket
  tags:
    - websocket
    - http
  health_check:
    health_type: "http"
    name: "websocket"
    url: "/health"
    interval: 15
    timeout: 60
    deregister_after: 60

