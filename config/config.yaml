  # 密钥严禁写入本文件，请通过环境变量注入：
  #   OSS_ACCESS_KEY / OSS_SECRET_KEY
  access_key: ""
  secret_key: ""
  bucket: suixiangliao-im-1359819014
  avatar_bucket: rust-im-1359819014
  region: ap-guangzhou  # 腾讯云地域
  # 腾讯云COS特有配置，仅当provider=cos时有效
  cos_app_id: 1359819014  # 腾讯云APPID
  cos_domain: https://suixiangliao-im-1359819014.cos.ap-guangzhou.myqcloud.com/  # 腾讯云COS自定义的域名

