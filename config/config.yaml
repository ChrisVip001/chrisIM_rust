# API网关基础配置
# 路由配置
gateway:
  routes:
    routes:
      # 用户服务路由
      - id: "user-service"
        name: "用户服务"
        path_prefix: "/api/users"
        service_type: "User"
        require_auth: true
        methods: []
        rewrite_headers: {}

      # 好友服务路由
      - id: "friend-service"
        name: "好友服务"
        path_prefix: "/api/friends"
        service_type: "Friend"
        require_auth: true
        methods: []
        rewrite_headers: {}

      # 群组服务路由
      - id: "group-service"
        name: "群组服务"
        path_prefix: "/api/groups"
        service_type: "Group"
        require_auth: true
        methods: []
        rewrite_headers: {}

      # 聊天服务路由
      - id: "chat-service"
        name: "聊天服务"
        path_prefix: "/api/chat"
        service_type: "Chat"
        require_auth: true
        methods: []
        rewrite_headers: {}

      # 公共服务路由
      - id: "common-service"
        name: "聊天服务"
        path_prefix: "/api/common"
        service_type: "Common"
        require_auth: true
        methods: [ ]
        rewrite_headers: { }

  # 限流配置
  rate_limit:
    # 全局限流
    # 按单机 3000 QPS 容量目标设定（留余量）；governor 是进程内限流，
    # 多实例部署时总量会按实例数放大，生产需按实际容量重设。
    global:
      requests_per_second: 5000
      burst_size: 500
      enabled: true

    # 按路径限流
    path_rules:
      # 登录接口限流
      - path_prefix: "/api/user/login"
        rule:
          requests_per_second: 5
          burst_size: 3
          enabled: true
      - path_prefix: "/api/user/loginByPhone"
        rule:
          requests_per_second: 5
          burst_size: 3
          enabled: true

      # 注册接口限流
      - path_prefix: "/api/user/register"
        rule:
          requests_per_second: 2
          burst_size: 5
          enabled: true

      # 用户接口限流
      - path_prefix: "/api/users"
        rule:
          requests_per_second: 10
          burst_size: 20
          enabled: true

      # 聊天写路径限流：与全局容量对齐，避免 20rps 把压测全部挡在网关
      - path_prefix: "/api/chat"
        rule:
          requests_per_second: 5000
          burst_size: 500
          enabled: true
    # IP限流
    ip_rules: {}

  # 认证配置
  auth:
    # JWT配置（密钥通过环境变量 JWT_SECRET 注入，严禁写入本文件）
    jwt:
      enabled: true
      secret: ""
      issuer: "api-gateway"
      expiry_seconds: 86400  # 24小时
      refresh_expiry_seconds: 604800  # 7天
      verify_issuer: false
      allowed_issuers: []
      header_name: "Authorization"
      header_prefix: "Bearer"
    # IP白名单
    ip_blacklist:
      - "192.168.1.9"
    # 路径白名单
    path_whitelist:
      - "/health"
      - "/metrics"
      - "/api/user/login"
      - "/api/user/loginByPhone"
      - "/api/users/registerByPhone"
      - "/api/users/registerByUsername"
      - "/api/users/sendVerificationCode"
      - "/api/users/genCaptchaImage"
      - "/api/users/forgetPassword"
      # 注册头像上传相关的API路径
      - "/api/files/register-avatar"
      - "/api/files/validate-register-avatar"
    # 安全头配置
    security_headers:
      enabled: true
      # 内容安全策略
      content_security_policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'"
      # 其他安全头
      x_frame_options: "DENY"
      x_content_type_options: "nosniff"
      x_xss_protection: "1; mode=block"
      strict_transport_security: "max-age=31536000; includeSubDomains"
      referrer_policy: "strict-origin-when-cross-origin"
    # 请求验证
    request_validation:
      max_request_size_mb: 10      # 最大请求大小
      max_header_count: 100        # 最大请求头数量
      max_header_size_kb: 8        # 单个请求头最大大小
      blocked_user_agents: []      # 阻止的User-Agent列表
      blocked_ips: []              # IP黑名单

  # Metrics暴露端点 指标配置
  metrics_endpoint: "/metrics"

  # 重试配置
  retry:
    max_retries: 3
    retry_interval_ms: 200

  # 熔断配置
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    half_open_timeout_secs: 30

component: all # all, api, ws, rpc, db, pusher

# 日志配置
log:
  level: "info"      # 全局日志级别: trace, debug, info, warn, error
  output: "console"      # 日志输出位置: console(控制台), file(文件，需配置rolling)
  format: "json"      # 日志格式: plain(纯文本), json(JSON格式，便于ELK等日志系统收集)
  sqlx_level: "info"  # SQL查询日志级别，控制数据库操作日志的详细程度
  rolling:
    rotation: "daily"          # 滚动策略:-minutely: 每分钟 - hourly: 每小时 - daily: 每天- never: 不滚动，所有日志写入同一文件
    max_files: 7               # 最大保留文件数量，超过此数量会自动删除最旧的文件(每次重启时删除)
    directory: "logs"          # 日志文件存储目录
    filename_prefix: ""        # 日志文件名前缀 最终文件名格式: {prefix}-{service_name}.{timestamp}或{service_name}.{timestamp}
  # 各组件的日志级别配置
  components:
    tower: "warn"    # HTTP中间件
    hyper: "warn"    # HTTP库
    axum: "info"     # HTTP框架
    tonic: "info"    # gRPC框架
    rustIM: "info"  # 本项目的日志
    redis: "warn"    # Redis操作

# 链路追踪配置
telemetry:
  enabled: false                            # 从true改为false，暂时禁用
  endpoint: "http://localhost:4317"         # Jaeger OTLP端点
  sampling_ratio: 1.0                       # 采样率(0.0 - 1.0)
  propagation: "tracecontext"               # 传播器: tracecontext, b3, jaeger


# 数据库配置
database:
  postgres:
    host: 127.0.0.1
    port: 5432
    user: kelisi
    password: 123456
    database: rustim
    # 消费端按会话分组并行，默认池（10）会成为吞吐上限
    pool_size: 64
  xdb: ./assets/ip2region.xdb

# 消息存储配置（统一读扩散，一条消息恒定 1 行元数据）
# 该段缺省时使用 MessageStorageConfig::default()，服务级 yaml 不参与覆盖。
message_storage:
  inline_content_max_bytes: 1024   # 不超过该值的正文内联进 msg_meta，省一次回表
  fetch_default_limit: 50          # 客户端未指定时的拉取条数
  fetch_max_limit: 500             # 单次拉取硬上限，防止超大页占满连接池
  hot_cache_messages: 200          # Redis 缓存的最近消息条数，规避复制延迟
  archive_after_days: 365          # 超过该天数由归档任务迁移
  batch_insert: true               # 单语句多行批量写入
  read_from_replica: false         # 历史拉取是否走只读副本（初期关闭）


# 服务配置
server:
  # 0.0.0.0 以便容器内可被端口映射访问；本地开发同样可用
  host: 0.0.0.0
  port: 8000
  ws_lb_strategy: RoundRobin # Random, RoundRobin
  # TLS/HTTPS配置
  tls:
    enabled: false  # 是否启用HTTPS
    cert_file: "./config/ssl/server.crt"  # 证书文件路径
    key_file: "./config/ssl/server.key"   # 私钥文件路径
    # 可选：客户端证书验证
    client_ca_file: "./config/ssl/ca.crt"  # CA证书文件
    require_client_cert: false  # 是否要求客户端证书
  # 超时配置
  timeouts:
    read_timeout_secs: 30      # 读取超时
    write_timeout_secs: 30     # 写入超时
    idle_timeout_secs: 60      # 空闲连接超时
  # 连接配置
  connection:
    max_connections: 10000     # 最大连接数
    keep_alive_timeout_secs: 75  # Keep-Alive超时
    tcp_nodelay: true          # 禁用Nagle算法


# 消息发送权限校验配置
validation:
  # 校验服务（Redis缓存+关系服务RPC）故障时是否放行消息：false=拒绝（安全优先），true=放行（可用性优先）
  fail_open: false

# consul服务注册与发现配置
service_center:
  host: 127.0.0.1   # 容器中由 CONSUL_HOST 指向 consul 服务
  port: 8500        # 容器中由 CONSUL_PORT 覆盖
  timeout: 3        # 秒；注册中心不可达时快速失败，避免挂起请求击穿 RTO
  protocol: http
  service_refresh_interval: 5  # 发现端刷新间隔，故障实例最迟 5s 内从负载均衡摘除

# WebSocket配置
websocket:
  protocol: ws
  host: 127.0.0.1
  port: 8085
  name: websocket
  tags:
    - websocket
    - http
  # 上行消息处理worker数：按会话哈希分散到多个worker并行处理，组内保序
  upstream_workers: 8
  # 心跳死链判定阈值：连续N个心跳周期未收到Pong即断开连接（默认2，约60秒）
  heartbeat_max_missed: 2
  # Consul 侧统一 TTL 自报：注册中心在独立网络命名空间，主动探测
  # 127.0.0.1 只会打到注册中心自身；进程假死由 k8s HTTP /health 探针兜底。
  health_check:
    health_type: "ttl"
    name: "websocket"
    url: ""
    interval: 10         # TTL 判定窗口 10s，上报周期自动取窗口的 1/3（3s）
    timeout: 2
    deregister_after: 60 # Consul 要求最小 1m，仅用于清理僵尸注册

# RPC服务配置
rpc:
  ws:
    protocol: http
    host: 127.0.0.1
    port: 50001
    name: ws
    tags:
      - ws
      - grpc
    health_check:
      health_type: "ttl"
      name: "ws"
      url: ""
      interval: 10         # TTL 窗口 10s，上报周期 3s
      timeout: 2
      deregister_after: 60 # 清理僵尸注册，不参与摘流（摘流靠 passing 过滤）
  chat:
    protocol: http
    host: 127.0.0.1
    port: 50010
    name: chat
    tags:
      - chat
      - grpc
    health_check:
      health_type: "ttl"
      name: "chat"
      url: ""
      interval: 10         # TTL 窗口 10s，上报周期 3s
      timeout: 2
      deregister_after: 60 # 清理僵尸注册，不参与摘流（摘流靠 passing 过滤）
  pusher:
    protocol: http
    host: 127.0.0.1
    port: 50003
    name: pusher
    tags:
      - pusher
      - grpc
    health_check:
      health_type: "ttl"
      name: "pusher"
      url: ""
      interval: 10         # TTL 窗口 10s，上报周期 3s
      timeout: 2
      deregister_after: 60 # 清理僵尸注册，不参与摘流（摘流靠 passing 过滤）
  user:
    protocol: http
    host: 127.0.0.1
    port: 50004
    name: user
    tags:
      - user
      - grpc
    health_check:
      health_type: "ttl"
      name: "user"
      url: ""
      interval: 10         # TTL 窗口 10s，上报周期 3s
      timeout: 2
      deregister_after: 60 # 清理僵尸注册，不参与摘流（摘流靠 passing 过滤）
  friend:
    protocol: http
    host: 127.0.0.1
    port: 50005
    name: friend
    tags:
      - friend
      - grpc
    health_check:
      health_type: "ttl"
      name: "friend"
      url: ""
      interval: 10         # TTL 窗口 10s，上报周期 3s
      timeout: 2
      deregister_after: 60 # 清理僵尸注册，不参与摘流（摘流靠 passing 过滤）
  group:
    protocol: http
    host: 127.0.0.1
    port: 50006
    name: group
    tags:
      - group
      - grpc
    health_check:
      health_type: "ttl"
      name: "group"
      url: ""
      interval: 10         # TTL 窗口 10s，上报周期 3s
      timeout: 2
      deregister_after: 60 # 清理僵尸注册，不参与摘流（摘流靠 passing 过滤）

# Redis配置
redis:
  host: 127.0.0.1
  port: 6379
  # 会话号段的预留步长：越大回写 PG 越少，但崩溃后跳号越多。
  # IM 场景 100 左右较为均衡（跳号不影响未读，未读用 last_msg_seq 计算）。
  seq_step: 100
  max_connections: 100
  pool_timeout_ms:  5000
  connection_timeout_ms:  5000

# Kafka配置
kafka:
  # 消息主题分区数：决定消费端并行度上限，按 conversation_id 哈希分区保序
  topic_partitions: 16
  # 消息主题副本数：生产环境建议3（配合min.insync.replicas=2），自动收敛到不超过broker数
  topic_replication: 3
  hosts:
    - 127.0.0.1:9092
  topic: rustIM-chat
  group: chat
  connect_timeout: 5000 # milliseconds
  producer:
    timeout: 3000
    acks: all # 0: 不等待服务器响应，1: 等待服务器响应，all: 等待服务器响应并确认
    max_retry: 3
    retry_interval: 1000 # retry interval in milliseconds
  consumer:
    auto_offset_reset: earliest # earliest, latest
    session_timeout: 20000
    # 消费者并行度：同组内运行N个消费者，分区自动均衡分配
    parallelism: 4

# OSS配置
