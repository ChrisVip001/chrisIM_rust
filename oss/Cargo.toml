[package]
name = "oss"
version = "0.1.0"
edition = "2021"


[features]
default = []
# AWS S3 支持（默认关闭，原因见 common 的 s3 feature 说明）
s3 = ["dep:aws-config", "dep:aws-sdk-s3", "dep:aws-smithy-runtime-api", "common/s3"]

[dependencies]
common = { path = "../common" }
aws-config = { version = "1.0.1", features = ["behavior-version-latest"], optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
aws-smithy-runtime-api = { version = "1.0.1", features = ["client"], optional = true }
bytes = "1.10.1"
md-5 = "0.10.1"

tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
chrono = "0.4.31"

# 腾讯云COS REST API依赖
reqwest = { workspace = true, features = ["json", "multipart"] }
hmac = "0.12.1"
sha1 = "0.10.5"
base64 = "0.21.0"
urlencoding = "2.1.3" 
url = "2.5.4"
