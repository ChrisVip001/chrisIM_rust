[workspace]
resolver = "2" # 使用 Cargo v2 依赖解析
members = [
    "contract",
    "runtime",
    "cache",
    "relation-service",
    "oss",
    "msg-server",
    "msg-gateway",
    "api-gateway",
    "msg-storage",
]

# 版本号只有这里一处权威来源。
# 升级版本时改这一行 + 追加 CHANGELOG.md，各 crate 通过 `version.workspace = true` 继承，
# `/health` 返回的 `version`（api-gateway 的 `env!("CARGO_PKG_VERSION")`）随之变化。
[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

# 发布构建配置统一在此定义。
# 不要在 .cargo/config.toml 或 Dockerfile 里写 [profile.*] —— Cargo 不认可 config 中的 profile，
# 会造成"本地构建与镜像构建产物不一致"而没有任何提示。
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace.dependencies]
tokio = { version = "1.36", features = ["full"] }
axum = "0.8.1"
axum-server = "0.7.2"
tonic = "0.13.1"
tonic-reflection = "0.13.1"
tonic-health = "0.13.1"
tonic-build = "0.13.1"
prost = "0.13.5"
prost-types = "0.13.5"
http-body-util = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.32"
bincode = "2.0.1"
## 缓存模块
redis = { version = "0.29.2", features = ["tokio-comp", "connection-manager"] }
sqlx = { version = "0.8.3", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0.12"
dotenv = "0.15"
jsonwebtoken = "9.2"
bcrypt = "0.17.0"
async-trait = "0.1.88"
rdkafka = { version = "0.37.0" }  # Kafka客户端
futures = "0.3"
config = "0.15.11"
clap = { version = "4", features = ["derive"] }
metrics = "0.24.1"
metrics-exporter-prometheus = "0.16.2"
prometheus = "0.13"
tokio-tungstenite = "0.26.2" # WebSocket for message gateway
reqwest = { version = "0.12.15", features = ["json"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["trace", "cors", "auth"] }
rand = "0.9.0"
# 默认的 `rustls` feature 映射到 legacy TLS 栈（rustls 0.21，已有多条 RUSTSEC 告警），
# 关闭默认特性并改用 rustls-aws-lc（rustls 0.23）：
# default-https-client → aws-smithy-http-client/rustls-aws-lc
aws-sdk-s3 = { version = "1.157.0", default-features = false, features = [
    "rt-tokio",
    "http-1x",
    "sigv4a",
    "default-https-client",
    "behavior-version-latest",
] }
base64 = "0.22.1"