# cargo audit 配置
# 运行方式：cargo audit （自动读取本文件）
#
# 说明：以下漏洞均来自「可选依赖」，默认构建不会编译这些代码路径，
# 因此不进入实际产物的依赖图（可用 `cargo tree -i <crate>` 验证）。
# 启用对应 feature 前请先评估并优先升级上游依赖。

[advisories]
ignore = [
    # h2 0.3 unbounded empty DATA frames（RUSTSEC-2026-0258）
    # 来源：opentelemetry-otlp 0.13 -> tonic 0.9 -> axum 0.6 -> hyper 0.14 -> h2 0.3
    # 仅在启用 common 的 `telemetry` feature 时进入依赖图
    "RUSTSEC-2026-0258",

    # rustls-webpki 0.101（RUSTSEC-2026-0104 / 0098 / 0099）
    # 来源：aws-smithy-http-client -> rustls 0.21 -> rustls-webpki 0.101
    # 仅在启用 common/oss 的 `s3` feature 时进入依赖图；
    # 上游修复需等待 aws-smithy-http-client 迁移到 hyper 1.x / rustls 0.23
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",

    # rsa 0.9 Marvin Attack（RUSTSEC-2023-0071，上游无修复版本）
    # 来源：可选依赖链（aws-sdk / 遥测）；本项目 JWT 使用 HS256，不涉及 RSA 解密路径
    "RUSTSEC-2023-0071",
]
