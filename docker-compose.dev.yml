version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rustim_postgres
    environment:
      POSTGRES_USER: kelisi
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: rustim
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kelisi"]
      interval: 10s
      timeout: 5s
      retries: 3

  # redis 服务已于 2026-11-04 移除：
  # 6379 端口由盒子IM的 boxim-redis 提供，ChrisIM 配置(config.yaml)直连 127.0.0.1:6379 复用

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: rustim_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 3

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: rustim_zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  consul:
    image: hashicorp/consul:1.15
    container_name: rustim_consul
    ports:
      - "8500:8500"
    command: agent -dev -client=0.0.0.0
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 配置工具 - 用于动态配置管理
  config-server:
    image: nginx:alpine
    container_name: rustim_config_server
    volumes:
      - ./config:/usr/share/nginx/html/config
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/config/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data: