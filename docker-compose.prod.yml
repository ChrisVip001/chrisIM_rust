version: '3.8'

# 生产环境编排
#
# 与旧版的差异：
# - 删除 user/friend/group 三个独立容器（已合并为 relation-service 模块化单体）
# - 新增 Consul 服务注册中心（所有服务的发现依赖它，此前是外部依赖，编排里没有）
# - Kafka 3 broker 副本集群（消息主题 replication=3, min.insync.replicas=2）
# - 密钥全部通过环境变量注入（OSS_ACCESS_KEY 等），config.yaml 不再落盘密钥
# - 业务服务去掉 container_name，支持 `--scale` 水平扩展

services:
  # 服务注册中心（必须最先就绪，业务服务启动即注册）
  consul:
    image: hashicorp/consul:1.18
    container_name: rustim_consul
    restart: unless-stopped
    ports:
      - "8500:8500"
    environment:
      CONSUL_LOCAL_CONFIG: |
        {
          "server": true,
          "bootstrap_expect": 1,
          "ui_config": { "enabled": false }
        }
    volumes:
      - consul_data:/consul/data
    networks:
      - rustim-network
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # API 网关服务
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: rustim/api-gateway:latest
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://rustim:${POSTGRES_PASSWORD}@postgres:5432/rustim
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - OSS_ACCESS_KEY=${OSS_ACCESS_KEY}
      - OSS_SECRET_KEY=${OSS_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    networks:
      - rustim-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: ["api-gateway"]

  # 消息网关服务（长连接接入层，可 --scale msg-gateway=N 水平扩展）
  msg-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: rustim/msg-gateway:latest
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://rustim:${POSTGRES_PASSWORD}@postgres:5432/rustim
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    networks:
      - rustim-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: ["msg-gateway"]

  # 关系服务（模块化单体：用户/好友/群组）
  relation-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: rustim/relation-service:latest
    restart: unless-stopped
    ports:
      - "50004:50004"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://rustim:${POSTGRES_PASSWORD}@postgres:5432/rustim
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    networks:
      - rustim-network
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50004"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: ["relation-service"]

  # 消息服务（消息生产/消费/落库/推送）
  msg-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: rustim/msg-server:latest
    restart: unless-stopped
    ports:
      - "50010:50010"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://rustim:${POSTGRES_PASSWORD}@postgres:5432/rustim
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-cluster:
        condition: service_healthy
      consul:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    networks:
      - rustim-network
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50010"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: ["msg-server"]

  # 对象存储服务
  oss:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: rustim/oss:latest
    restart: unless-stopped
    ports:
      - "50005:50005"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://rustim:${POSTGRES_PASSWORD}@postgres:5432/rustim
      - OSS_ACCESS_KEY=${OSS_ACCESS_KEY}
      - OSS_SECRET_KEY=${OSS_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks:
      - rustim-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:50005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: ["oss"]

  # PostgreSQL 数据库
  # 更高可用请使用 PostgreSQL 流复制主从或 Kubernetes 上的 CloudNativePG Operator，
  # 本文件保持单实例以维持编排简洁（应用层经 Consul 重连，可容忍短暂重启）。
  postgres:
    image: postgres:16-alpine
    container_name: rustim_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rustim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rustim
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - rustim-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustim -d rustim"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=400
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: rustim_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - rustim-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: redis-server /usr/local/etc/redis/redis.conf

  # Zookeeper（Kafka 依赖）
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: rustim_zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_INIT_LIMIT: 5
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - rustim-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Kafka 3 broker 集群：消息主题在编排层保证 replication=3
  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 16
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka1_data:/var/lib/kafka/data
    networks:
      - rustim-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 16
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka2_data:/var/lib/kafka/data
    networks:
      - rustim-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9093"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 16
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka3_data:/var/lib/kafka/data
    networks:
      - rustim-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9094"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Kafka 集群健康聚合：业务服务依赖它而不是单个 broker
  kafka-cluster:
    image: confluentinc/cp-kafka:7.5.0
    container_name: rustim_kafka_cluster
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint: ["sh", "-c", "sleep infinity"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka-1:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - rustim-network

  # Nginx 负载均衡器
  nginx:
    image: nginx:alpine
    container_name: rustim_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - api-gateway
      - msg-gateway
    networks:
      - rustim-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_logs:
    driver: local
  kafka1_data:
    driver: local
  kafka2_data:
    driver: local
  kafka3_data:
    driver: local
  consul_data:
    driver: local

networks:
  rustim-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
